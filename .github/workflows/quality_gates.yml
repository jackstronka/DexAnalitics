name: Quality Gates

# lineage_shadow_diff golden runs inside `cargo test --workspace` (ci.yml, job rust).

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches:
      - main
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  critical_area_requires_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gate critical areas with tests
        env:
          BASE_REF: ${{ github.base_ref }}
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-tests-needed') && '1' || '0' }}
        run: bash scripts/ci/critical-area-test-gate.sh

  bugs_have_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Unit test bugs_test_guard.py
        working-directory: tools
        run: python3 test_bugs_test_guard.py
      - name: high/critical BUGS.md must name existing tests (C5)
        run: bash scripts/ci/bugs-test-guard.sh

  golden_delta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Unit test golden_delta.py
        working-directory: tools
        run: python3 test_golden_delta.py
      - name: Publish golden delta table
        env:
          BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/ci/golden-delta.sh

  test_areas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: R1 test-areas map + classifier unit tests
        run: bash scripts/ci/test-areas.sh

  test_report_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: R2 test_report.py unit tests
        working-directory: tools
        run: python3 test_test_report.py

  test_trend_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: R4 test_trend.py unit tests
        run: bash scripts/ci/test-trend.sh

  test_protection_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: R5 subsystem protection + MASTER check
        run: bash scripts/ci/test-protection.sh

  mutants_d5_summary_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: D5 mutants summary unit tests
        working-directory: tools
        run: python3 test_mutants_d5_summary.py

  verify_fast_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: E1 verify_fast.py unit tests
        working-directory: tools
        run: python3 test_verify_fast.py
