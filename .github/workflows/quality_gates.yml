name: Quality Gates

# lineage_shadow_diff golden runs inside `cargo test --workspace` (ci.yml, job rust).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  critical_area_requires_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gate critical areas with tests
        env:
          BASE_REF: ${{ github.base_ref }}
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-tests-needed') && '1' || '0' }}
        run: bash scripts/ci/critical-area-test-gate.sh
