name: Quality Gates

# lineage_shadow_diff golden runs inside `cargo test --workspace` (ci.yml, job rust).

on:
  pull_request:
    branches:
      - main
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  critical_area_requires_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Gate critical areas with tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci/critical-area-test-gate.sh
