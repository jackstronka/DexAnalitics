name: CI

# Required checks on main: rust, web, db (+ quality_gates / critical_area_requires_tests).
# Local equivalent: make verify (Windows: tools/verify.ps1).

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  LOGLEVEL: WARN
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: build tests
        run: cargo nextest run --workspace --no-run

      # Unit/integration tests must be hermetic: run them in a network namespace with only loopback
      # (local mock servers work, public RPC / HTTP APIs fail fast instead of passing by luck).
      # E2: cargo-nextest (process-per-test); EnvGuard uses a cross-process file lock.
      # R2: JUnit under target/nextest/ci/junit.xml (profile.ci.junit).
      - name: tests (no network)
        id: rust_tests
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn sh -c 'ip link set lo up && cargo nextest run --workspace --offline --profile ci'

      - name: Upload nextest JUnit
        if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: junit-rust
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clmm_user
          POSTGRES_PASSWORD: clmm_password
          POSTGRES_DB: clmm_lp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clmm_user -d clmm_lp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://clmm_user:clmm_password@localhost:5432/clmm_lp_test
      CLMM_REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Postgres GL integration tests
        run: cargo nextest run -p clmm-lp-data --test session_gl_integration --profile ci --no-capture

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # package-lock.json is gitignored, so `npm ci` is not available.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: OpenAPI TypeScript snapshot (C2)
        run: npm run check:api-gen

      - name: tsc
        run: npx tsc --noEmit

      - name: vitest
        run: |
          mkdir -p ../target/test-report
          npx vitest run --reporter=default --reporter=junit --outputFile=../target/test-report/vitest-junit.xml

      - name: eslint
        run: npm run lint

      - name: Upload vitest JUnit
        if: always() && hashFiles('target/test-report/vitest-junit.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: junit-web
          path: target/test-report/vitest-junit.xml
          if-no-files-found: ignore

  test_report:
    name: test_report
    runs-on: ubuntu-latest
    needs: [rust, web]
    if: always()
    steps:
      - uses: actions/checkout@v5

      - name: Download rust JUnit
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: junit-rust
          path: artifacts/rust

      - name: Download web JUnit
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: junit-web
          path: artifacts/web

      - name: Unit test test_report.py
        working-directory: tools
        run: python3 test_test_report.py

      - name: Build R2 area report
        env:
          TEST_REPORT_OUT: target/test-report
        run: |
          set -e
          files=()
          [[ -f artifacts/rust/junit.xml ]] && files+=(artifacts/rust/junit.xml)
          [[ -f artifacts/web/vitest-junit.xml ]] && files+=(artifacts/web/vitest-junit.xml)
          # download-artifact may flatten or keep basename
          shopt -s nullglob
          for f in artifacts/rust/*.xml artifacts/web/*.xml; do
            files+=("$f")
          done
          # unique
          mapfile -t files < <(printf '%s\n' "${files[@]}" | awk 'NF && !seen[$0]++')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No JUnit artifacts — skip report"
            exit 0
          fi
          bash scripts/ci/test-report.sh "${files[@]}"

      - name: Upload test report JSON
        if: always() && hashFiles('target/test-report/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            target/test-report/report.json
            target/test-report/report.md
          if-no-files-found: ignore
