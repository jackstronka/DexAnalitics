# R1 — mapa test → obszar projektu (G9).
# Matching: longest-prefix on a normalized id.
#   Rust nextest oneline: "clmm-lp-api openapi::tests::foo" → "clmm-lp-api::openapi::tests::foo"
#   Web vitest file: "web/src/lib/whirlpoolTicks.test.ts" (forward slashes)
# Unmatched → area "Inne" (warning). Prefer longer, more specific prefixes first in spirit;
# the tool always picks the longest matching prefix.

version = 1

[[area]]
id = "ekonomia_gl"
label = "Ekonomia / GL"
